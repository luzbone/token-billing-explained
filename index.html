<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* token-bill-theme — same key as src/lib/theme.ts */
      (function () {
        try {
          var t = localStorage.getItem("token-bill-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html {
        background-color: #05060a;
        color-scheme: dark;
      }
      html[data-theme="light"] {
        background-color: #efe8dc;
        color-scheme: light;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive playground that teaches how LLM API token billing actually works — input, output, cache writes, cache reads — with live pricing comparison across Anthropic, OpenAI, Gemini and Grok."
    />
    <title>Token Billing, Explained · Interactive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Heebo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
